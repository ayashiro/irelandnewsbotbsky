steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ireland-news-bot:$SHORT_SHA
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ireland-news-bot:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ireland-news-bot

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ireland-news-bot
      - --region=europe-west1
      - --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ireland-news-bot:$SHORT_SHA

images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ireland-news-bot:$SHORT_SHA
  - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ireland-news-bot:latest

options:
  logging: CLOUD_LOGGING_ONLY
